[package]
# Binary name, window title, env-var prefix (OMNIMON_*), config dir and
# metric namespace are all derived from `name` (see src/brand.rs).
name = "omnimon"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
description = "Terminal monitor for GPUs (NVIDIA, Apple, AMD, Intel), the processes using them and the machine around them. One binary for Linux, Windows and macOS; works in containers and WSL."
license = "MIT"
repository = "https://github.com/sorbet-ai/omnimon"
homepage = "https://github.com/sorbet-ai/omnimon"
readme = "README.md"
keywords = ["gpu", "monitor", "nvidia", "tui", "nvml"]
categories = ["command-line-utilities", "hardware-support"]
# Keep the published crate to what builds and tests it.
include = ["src/**/*", "tests/fixtures/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "rustfmt.toml"]

# `cargo binstall omnimon` downloads the release binary instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libloading = "0.9.0"
log = "0.4.34"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.38.4"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
