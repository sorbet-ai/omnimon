name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin, cross: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Nightly version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: echo "OMNIMON_BUILD=nightly.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Format
        if: ${{ !matrix.cross }}
        run: cargo fmt --check
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test
      - name: Clippy
        if: ${{ !matrix.cross }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Installer scripts
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: sh -n install.sh
      - name: Build (zig, glibc 2.17)
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --target ${{ matrix.target }}.2.17
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          NAME=$(sed -n 's/^name *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          cp "target/${{ matrix.target }}/release/$NAME$EXT" "dist/$NAME-${{ matrix.target }}$EXT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and installers
        run: |
          cd dist
          sha256sum omnimon-* > SHA256SUMS
          cp ../install.sh ../install.ps1 .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # A rolling "nightly" prerelease of the latest main, so the newest code
  # installs with one line:
  #   curl -fsSL https://github.com/sorbet-ai/omnimon/releases/download/nightly/install.sh | sh
  # Prereleases never become /releases/latest, so the stable one-liner is unaffected.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and installers (defaulting to nightly)
        run: |
          cd dist
          sha256sum omnimon-* > SHA256SUMS
          sed 's/^DEFAULT_VERSION="latest"/DEFAULT_VERSION="nightly"/' ../install.sh > install.sh
          sed "s/^\$defaultVersion = 'latest'/\$defaultVersion = 'nightly'/" ../install.ps1 > install.ps1
          grep -q '^DEFAULT_VERSION="nightly"' install.sh
          grep -q "^\$defaultVersion = 'nightly'" install.ps1
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA::7}
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/nightly"
          {
            echo "Latest build of main ($short, $(date -u +%F)), rebuilt on every push."
            echo
            echo '```sh'
            echo "curl -fsSL $url/install.sh | sh"
            echo '```'
            echo
            echo '```powershell'
            echo "irm $url/install.ps1 | iex"
            echo '```'
          } > notes.md
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly ($short)" --notes-file notes.md
