name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin, cross: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Format
        if: ${{ !matrix.cross }}
        run: cargo fmt --check
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test
      - name: Clippy
        if: ${{ !matrix.cross }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Installer scripts
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: sh -n install.sh
      - name: Build (zig, glibc 2.17)
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --target ${{ matrix.target }}.2.17
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          NAME=$(sed -n 's/^name *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          cp "target/${{ matrix.target }}/release/$NAME$EXT" "dist/$NAME-${{ matrix.target }}$EXT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and installers
        run: |
          cd dist
          sha256sum omnimon-* > SHA256SUMS
          cp ../install.sh ../install.ps1 .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
